  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Kitchen cabinet studio</title>
  </head>
  <body>
    <header>
      <h1>Kitchen cabinet studio</h1>
      <nav class="tabs">
        <button data-tab="view" class="active">3D view</button>

      <div class="actions">
        <button id="open-all">Open all</button>

    <div id="notice" hidden></div>
    <main>
      <section id="view">
        <div class="hint">Click a door, drawer or flap to open it · drag to orbit · scroll to zoom</div>
      </section>
      <section id="order" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
